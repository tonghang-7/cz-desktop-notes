name: 提个建议
description: 想要一个新功能，或者觉得哪里别扭
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: 你想要什么
      description: 一两句话说清楚就行
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: 为什么需要它
      description: 什么场景下会用到，没有这个的时候你现在是怎么绕过去的
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过别的做法吗
      description: 有的话写下来，能省掉一轮来回
    validations:
      required: false
